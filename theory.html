<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Теория | Rain Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><div class="logo-icon-wrap">Ψ</div><span>Rain Test</span></a>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab">Предметы</a>
      <a href="theory.html" class="nav-tab active">Теория</a>
      <a href="tickets.html" class="nav-tab">Билеты</a>
      <a href="progress.html" class="nav-tab">Прогресс</a>
    </div>
    <div class="controls"><a href="admin.html" class="icon-btn">⚙️</a><button class="icon-btn" id="themeToggle"><span id="themeIcon">🌙</span></button></div>
  </header>

  <main>
    <h1 id="th-header" class="section-title">Теория</h1>
    <p class="section-subtitle">Конспекты и материалы по дисциплинам</p>

    <div id="admin-theory-box" style="display: none; margin-bottom: 30px;">
      <div class="quiz-card">
        <h3 style="margin-bottom: 15px;">Добавить теорию</h3>
        <select id="th-subject" style="margin-bottom: 10px;"></select>
        <input type="text" id="th-title" placeholder="Заголовок темы">
        <textarea id="th-content" placeholder="Текст (можно HTML: <img src='...'>)" rows="5"></textarea>
        <button class="btn-primary" onclick="saveTheory()">Сохранить</button>
      </div>
    </div>

    <div id="content-area" class="subjects-grid"></div>
  </main>

  <script>
    const SUPABASE_URL = 'https://vgyhmydzbshdjlmbdsbq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Wbus_dDyxCuBBxZrxubw6Q_aQnqMCAM';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    let isAdmin = false;
    let subjList = [];
    const contentArea = document.getElementById("content-area");
    const thHeader = document.getElementById("th-header");
    const adminBox = document.getElementById("admin-theory-box");
    const subjSelect = document.getElementById("th-subject");

    db.auth.getSession().then(({ data: { session } }) => {
      if (session) { isAdmin = true; adminBox.style.display = "block"; }
    });

    async function loadSubjects() {
      const { data } = await db.from('subjects').select('*').order('name');
      subjList = data || [];
      subjSelect.innerHTML = subjList.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
      showSubjects();
    }

    function showSubjects() {
      thHeader.textContent = "Выберите дисциплину";
      contentArea.innerHTML = subjList.map(s => `
        <a href="#" class="subject-card" onclick="showThemes('${s.id}', '${s.name}'); return false;">
          <div class="subject-name">${s.name}</div>
        </a>
      `).join("");
    }

    async function showThemes(subId, subName) {
      thHeader.textContent = subName;
      contentArea.innerHTML = "<p>Загрузка тем...</p>";
      const { data } = await db.from('theory').select('*').eq('subject', subId).order('id', { ascending: false });
      
      if (!data || !data.length) {
        contentArea.innerHTML = `<p>По этой дисциплине пока нет теории.</p> <button class="btn-primary" onclick="showSubjects()">Назад</button>`;
        return;
      }

      let html = `<div style="grid-column: 1/-1; margin-bottom: 20px;"><button class="btn-secondary" onclick="showSubjects()">← Назад к дисциплинам</button></div>`;
      data.forEach(t => {
        html += `
          <div class="quiz-card" style="grid-column: 1/-1;">
            <h2>${t.title}</h2>
            <div style="margin-top: 15px;">${t.content}</div>
            ${isAdmin ? `<button class="btn-secondary" style="margin-top:15px; color:var(--error);" onclick="deleteTheory(${t.id}, '${subId}', '${subName}')">Удалить</button>` : ""}
          </div>
        `;
      });
      contentArea.innerHTML = html;
    }

    window.saveTheory = async () => {
      const subject = subjSelect.value;
      const title = document.getElementById("th-title").value;
      const content = document.getElementById("th-content").value;
      if (!title || !content) { alert("Заполните поля!"); return; }
      const { error } = await db.from('theory').insert([{ subject, title, content }]);
      if (error) alert("Ошибка: " + error.message);
      else { document.getElementById("th-title").value = ""; document.getElementById("th-content").value = ""; alert("Добавлено!"); }
    };

    window.deleteTheory = async (id, subId, subName) => {
      if(!confirm("Удалить?")) return;
      await db.from('theory').delete().eq('id', id);
      showThemes(subId, subName);
    };

    loadSubjects();

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeIcon.textContent = '☀️'; }
    themeToggle.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); themeIcon.textContent = '🌙'; } 
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); themeIcon.textContent = '☀️'; }
    };
  </script>
</body>
</html>
