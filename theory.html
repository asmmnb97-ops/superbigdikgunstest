<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Теория | Rain Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><svg viewBox="0 0 100 100"><path d="M 50 85 C 20 85, 10 55, 30 40 C 45 28, 55 28, 70 40 C 90 55, 80 85, 50 85 Z" fill="var(--accent)"/></svg><span>Rain Test</span></a>
    <div class="controls"><button class="icon-btn" id="themeToggle"><span id="themeIcon">🌙</span></button></div>
  </header>

  <main>
    <h1 id="th-header" style="margin-bottom: 20px; font-family: 'Manrope';">Теория</h1>

    <div id="admin-theory-box" style="display: none; margin-bottom: 20px;">
      <div class="quiz-card">
        <h3 style="margin-bottom: 15px;">Добавить теорию</h3>
        <select id="th-subject"></select>
        <input type="text" id="th-title" placeholder="Заголовок темы">
        <textarea id="th-content" rows="4" placeholder="Текст (можно HTML-картинки: <img src='...'>)"></textarea>
        <button class="btn-primary" onclick="saveTheory()">Сохранить</button>
      </div>
    </div>

    <div id="content-area" class="grid"></div>
  </main>

  <footer class="pond-footer" id="pondFooter">
    <svg class="pond-waves" viewBox="0 0 1440 90" preserveAspectRatio="none"><path d="M0,40 C320,90 480,0 720,40 C960,80 1120,0 1440,40 L1440,90 L0,90 Z" fill="var(--water-surface)"/></svg>
  </footer>

  <script>
    const SUPABASE_URL = 'https://vgyhmydzbshdjlmbdsbq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Wbus_dDyxCuBBxZrxubw6Q_aQnqMCAM';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    let isAdmin = false;
    let subjList = [];
    const contentArea = document.getElementById("content-area");
    const thHeader = document.getElementById("th-header");
    const adminBox = document.getElementById("admin-theory-box");
    const subjSelect = document.getElementById("th-subject");

    db.auth.getSession().then(({ data: { session } }) => {
      if (session) { isAdmin = true; adminBox.style.display = "block"; }
    });

    async function loadSubjects() {
      const { data } = await db.from('subjects').select('*').order('name');
      subjList = data || [];
      subjSelect.innerHTML = subjList.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
      showSubjects();
    }

    function showSubjects() {
      thHeader.textContent = "Выберите дисциплину";
      contentArea.innerHTML = subjList.map(s => `<div class="card" onclick="showThemes('${s.id}', '${s.name}')"><span>${s.name}</span></div>`).join("");
    }

    async function showThemes(subId, subName) {
      thHeader.textContent = subName;
      contentArea.innerHTML = "<p>Загрузка...</p>";
      const { data } = await db.from('theory').select('*').eq('subject', subId).order('id', { ascending: false });
      
      if (!data || !data.length) { contentArea.innerHTML = `<p>Нет теории.</p><button class="btn-secondary" onclick="showSubjects()" style="margin-top:10px;">Назад</button>`; return; }

      let html = `<div style="grid-column: 1/-1; margin-bottom: 10px;"><button class="btn-secondary" onclick="showSubjects()">← Назад</button></div>`;
      data.forEach(t => {
        html += `<div class="quiz-card" style="grid-column: 1/-1;"><h2>${t.title}</h2><div style="margin-top: 15px;">${t.content}</div>${isAdmin ? `<button class="btn-primary" style="margin-top:15px; background:var(--error);" onclick="deleteTheory(${t.id}, '${subId}', '${subName}')">Удалить</button>` : ""}</div>`;
      });
      contentArea.innerHTML = html;
    }

    window.saveTheory = async () => {
      const subject = subjSelect.value;
      const title = document.getElementById("th-title").value;
      const content = document.getElementById("th-content").value;
      if (!title || !content) { alert("Заполните поля!"); return; }
      await db.from('theory').insert([{ subject, title, content }]);
      document.getElementById("th-title").value = ""; document.getElementById("th-content").value = "";
      alert("Добавлено!");
    };

    window.deleteTheory = async (id, subId, subName) => {
      if(!confirm("Удалить?")) return;
      await db.from('theory').delete().eq('id', id);
      showThemes(subId, subName);
    };

    loadSubjects();

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeIcon.textContent = '☀️'; }
    themeToggle.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); themeIcon.textContent = '🌙'; } 
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); themeIcon.textContent = '☀️'; }
    };

    const footer = document.getElementById('pondFooter');
    footer.addEventListener('click', (e) => {
      const rect = footer.getBoundingClientRect();
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = (e.clientX - rect.left) + 'px';
      ripple.style.top = (e.clientY - rect.top) + 'px';
      ripple.style.width = '100px'; ripple.style.height = '100px';
      footer.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1200);
    });
  </script>
</body>
</html>
