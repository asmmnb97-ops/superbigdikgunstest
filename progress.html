<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прогресс | Rain Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><div class="logo-badge">🪷</div><span>Rain Test</span></a>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab">Предметы</a>
      <a href="theory.html" class="nav-tab">Теория</a>
      <a href="tickets.html" class="nav-tab">Билеты</a>
      <a href="progress.html" class="nav-tab active">Прогресс</a>
    </div>
    <div class="controls"><a href="admin.html" class="icon-btn">⚙️</a><button class="icon-btn" id="themeToggle"><span id="themeIcon">🌙</span></button></div>
  </header>

  <main>
    <h1 class="section-title">Ваш прогресс</h1>
    <p class="section-subtitle">Отслеживайте изученные темы</p>
    <div id="progress-content" style="display: flex; flex-direction: column; gap: 16px;"></div>
  </main>

  <script>
    const SUPABASE_URL = 'https://vgyhmydzbshdjlmbdsbq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Wbus_dDyxCuBBxZrxubw6Q_aQnqMCAM';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const subNames = { obshaya: "Общая психология", istoriya: "История психологии", antropologiya: "Антропология", anatomiya: "Анатомия" };
    const learned = JSON.parse(localStorage.getItem("learned") || "{}");

    async function loadProgress() {
      const content = document.getElementById("progress-content");
      const { data: rows, error } = await db.from('questions').select('subject, question_type');
      if (error) { content.innerHTML = `<p style="color:var(--error)">Ошибка: ${error.message}</p>`; return; }
      
      let html = "";
      for (const [subId, subName] of Object.entries(subNames)) {
        const subData = rows.filter(r => r.subject === subId);
        const totalTest = subData.filter(r => r.question_type === 'test').length;
        const totalOpen = subData.filter(r => r.question_type === 'open').length;
        const total = totalTest + totalOpen;
        if (total === 0) continue;

        const learnedData = learned[subId] || { test: [], open: [] };
        const learnedTest = learnedData.test ? learnedData.test.length : 0;
        const learnedOpen = learnedData.open ? learnedData.open.length : 0;
        const percent = total > 0 ? Math.round(((learnedTest + learnedOpen) / total) * 100) : 0;

        html += `
          <div class="quiz-card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <h3 style="font-family: 'Manrope';">${subName}</h3>
              <span style="font-weight: 600; color: var(--accent);">${percent}%</span>
            </div>
            <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 12px;">
              Изучено: ${learnedTest + learnedOpen} из ${total} (Тесты: ${learnedTest}/${totalTest} | Открытые: ${learnedOpen}/${totalOpen})
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${percent}%;"></div>
            </div>
          </div>
        `;
      }
      content.innerHTML = html || "<p>Нет данных.</p>";
    }

    loadProgress();

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeIcon.textContent = '☀️'; }
    themeToggle.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); themeIcon.textContent = '🌙'; } 
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); themeIcon.textContent = '☀️'; }
    };
  </script>
</body>
</html>
