<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дисциплина | Rain Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><svg viewBox="0 0 100 100"><path d="M 50 85 C 20 85, 10 55, 30 40 C 45 28, 55 28, 70 40 C 90 55, 80 85, 50 85 Z" fill="var(--accent)"/></svg><span>Rain Test</span></a>
    <div class="controls">
      <button class="icon-btn" id="themeToggle"><span id="themeIcon">🌙</span></button>
    </div>
  </header>

  <main>
    <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
      <h1 id="title" style="font-family: 'Manrope'; font-size: 1.6rem;"></h1>
      <button class="btn-primary" id="addBtn" style="display: none;" onclick="openForm()">+ Добавить</button>
    </div>

    <div id="form-box" class="quiz-card" style="display: none; margin-bottom: 20px;">
      <h2 id="form-title" style="margin-bottom: 20px;">Новый вопрос</h2>
      <input type="hidden" id="edit-id">
      
      <input type="text" id="q-topic" placeholder="Тема (например, ЦНС)">
      
      <select id="q-type">
        <option value="test">Тест (4 варианта)</option>
        <option value="open">Открытый</option>
        <option value="word">Вставить слово</option>
        <option value="match">На соответствие</option>
      </select>

      <textarea id="q-text" rows="3" placeholder="Текст вопроса..."></textarea>

      <div id="fields-test">
        <input type="text" id="opt0" placeholder="Вариант А">
        <input type="text" id="opt1" placeholder="Вариант Б">
        <input type="text" id="opt2" placeholder="Вариант В">
        <input type="text" id="opt3" placeholder="Вариант Г">
        <select id="correct">
          <option value="0">Правильный: А</option>
          <option value="1">Правильный: Б</option>
          <option value="2">Правильный: В</option>
          <option value="3">Правильный: Г</option>
        </select>
      </div>

      <div id="fields-word" style="display: none;">
        <input type="text" id="word-answer" placeholder="Правильное слово">
      </div>

      <div id="fields-match" style="display: none;">
        <textarea id="match-pairs" rows="4" placeholder="Ощущение: Отражение отдельного свойства&#10;Восприятие: Целостный образ предмета"></textarea>
      </div>

      <textarea id="q-explain" rows="2" placeholder="Пояснение (необязательно)"></textarea>

      <div style="display: flex; gap: 10px;">
        <button class="btn-primary" onclick="saveQuestion()">Сохранить</button>
        <button class="btn-secondary" onclick="closeForm()">Отмена</button>
      </div>
    </div>

    <div id="content"></div>
  </main>

  <footer class="pond-footer" id="pondFooter">
    <svg class="pond-waves" viewBox="0 0 1440 90" preserveAspectRatio="none"><path d="M0,40 C320,90 480,0 720,40 C960,80 1120,0 1440,40 L1440,90 L0,90 Z" fill="var(--water-surface)"/></svg>
  </footer>

  <script>
    const SUPABASE_URL = 'https://vgyhmydzbshdjlmbdsbq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Wbus_dDyxCuBBxZrxubw6Q_aQnqMCAM';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const subNames = { obshaya: "Общая психология", istoriya: "История психологии", antropologiya: "Антропология", anatomiya: "Анатомия" };
    const id = new URLSearchParams(location.search).get("id");
    document.getElementById("title").textContent = subNames[id] || "Не найдено";
    
    let questions = [];
    let isAdmin = false;

    db.auth.getSession().then(({ data: { session } }) => {
      if (session) { isAdmin = true; document.getElementById("addBtn").style.display = "block"; }
    });

    async function loadData() {
      const { data, error } = await db.from('questions').select('*').eq('subject', id);
      if (error) { document.getElementById("content").innerHTML = `<p class="error">${error.message}</p>`; return; }
      questions = data;
      render();
    }

    window.openForm = (q = null) => {
      document.getElementById("form-box").style.display = "block";
      document.getElementById("form-title").textContent = q ? "Редактировать" : "Новый вопрос";
      document.getElementById("edit-id").value = q ? q.id : "";
      document.getElementById("q-topic").value = q ? q.topic : "";
      document.getElementById("q-type").value = q ? q.question_type : "test";
      document.getElementById("q-text").value = q ? q.question_text : "";
      document.getElementById("q-explain").value = q ? q.explanation : "";
      
      document.getElementById("fields-test").style.display = "none";
      document.getElementById("fields-word").style.display = "none";
      document.getElementById("fields-match").style.display = "none";

      if (q && q.question_type === "test") {
        document.getElementById("fields-test").style.display = "block";
        document.getElementById("opt0").value = q.options[0] || "";
        document.getElementById("opt1").value = q.options[1] || "";
        document.getElementById("opt2").value = q.options[2] || "";
        document.getElementById("opt3").value = q.options[3] || "";
        document.getElementById("correct").value = q.correct_answer;
      } else if (q && q.question_type === "word") {
        document.getElementById("fields-word").style.display = "block";
        document.getElementById("word-answer").value = q.metadata?.answer || "";
      } else if (q && q.question_type === "match") {
        document.getElementById("fields-match").style.display = "block";
        document.getElementById("match-pairs").value = q.metadata?.pairs || "";
      } else {
        document.getElementById("fields-test").style.display = "block";
      }
    };

    window.closeForm = () => document.getElementById("form-box").style.display = "none";

    document.getElementById("q-type").onchange = (e) => {
      document.getElementById("fields-test").style.display = e.target.value === "test" ? "block" : "none";
      document.getElementById("fields-word").style.display = e.target.value === "word" ? "block" : "none";
      document.getElementById("fields-match").style.display = e.target.value === "match" ? "block" : "none";
    };

    window.saveQuestion = async () => {
      const editId = document.getElementById("edit-id").value;
      const type = document.getElementById("q-type").value;
      const payload = {
        subject: id,
        topic: document.getElementById("q-topic").value,
        question_type: type,
        question_text: document.getElementById("q-text").value,
        explanation: document.getElementById("q-explain").value
      };

      if (type === "test") {
        payload.options = [document.getElementById("opt0").value, document.getElementById("opt1").value, document.getElementById("opt2").value, document.getElementById("opt3").value];
        payload.correct_answer = parseInt(document.getElementById("correct").value);
      } else if (type === "word") {
        payload.metadata = { answer: document.getElementById("word-answer").value };
      } else if (type === "match") {
        payload.metadata = { pairs: document.getElementById("match-pairs").value };
      }

      if (editId) {
        await db.from('questions').update(payload).eq('id', editId);
      } else {
        await db.from('questions').insert([payload]);
      }
      closeForm(); loadData();
    };

    window.deleteQuestion = async (qid) => {
      if (!confirm("Удалить?")) return;
      await db.from('questions').delete().eq('id', qid);
      loadData();
    };

    function render() {
      const content = document.getElementById("content");
      if (!questions.length) { content.innerHTML = "<p>Вопросов пока нет.</p>"; return; }

      content.innerHTML = questions.map(q => {
        const adminBtns = isAdmin ? `
          <div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 8px;">
            <button class="icon-btn" style="padding: 6px;" onclick='openForm(${JSON.stringify(q).replace(/'/g, "&#39;")})'>✏️</button>
            <button class="icon-btn" style="padding: 6px; color: var(--error);" onclick="deleteQuestion(${q.id})">🗑️</button>
          </div>
        ` : "";

        let innerHTML = "";
        if (q.question_type === "test") {
          innerHTML = `<div class="options-list">${q.options.map((opt, i) => `<button class="option-btn" onclick="checkTest(${q.id}, ${i}, ${q.correct_answer})"><span class="option-letter">${['А','Б','В','Г'][i]}</span><span>${opt}</span></button>`).join("")}</div>`;
        } else if (q.question_type === "open") {
          innerHTML = `<textarea rows="3" placeholder="Ваш ответ..."></textarea><button class="btn-secondary" style="margin-top: 10px;" onclick="toggleAnswer(${q.id})">Показать ответ</button><div id="ans-${q.id}" class="explanation"><div class="explanation-title">Эталон</div><div class="explanation-text">${q.model_answer || "Нет"}</div></div>`;
        } else if (q.question_type === "word") {
          innerHTML = `<input type="text" id="word-input-${q.id}" placeholder="Введите слово..."><button class="btn-secondary" style="margin-top: 10px;" onclick="checkWord(${q.id}, '${q.metadata?.answer}')">Проверить</button><div id="res-${q.id}" style="margin-top: 10px;"></div>`;
        } else if (q.question_type === "match") {
          const pairs = (q.metadata?.pairs || "").split("\n").filter(l => l.includes(":"));
          innerHTML = `<div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;">${pairs.map((p, i) => { const [left, right] = p.split(":"); return `<div style="display: flex; gap: 10px; align-items: center;"><span style="flex: 1; font-weight: 500;">${left.trim()}</span><input type="text" id="match-${q.id}-${i}" placeholder="Ответ..." style="flex: 1;"><span style="flex: 1; color: var(--text-secondary); font-size: 0.9rem;">(${right.trim()})</span></div>`; }).join("")}</div><button class="btn-secondary" onclick="toggleAnswer(${q.id})">Показать ответы</button>`;
        }

        return `
          <div class="quiz-card" style="position: relative;">
            ${adminBtns}
            <span class="subject-tag">${q.topic || "Разное"}</span>
            <h2 class="question-text">${q.question_text}</h2>
            ${innerHTML}
            ${q.explanation ? `<div id="exp-${q.id}" class="explanation"><div class="explanation-title">💡 Почему так?</div><div class="explanation-text">${q.explanation}</div></div>` : ""}
          </div>
        `;
      }).join("");
    }

    window.checkTest = (qid, selected, correct) => {
      const card = document.querySelector(`.quiz-card:has(.option-btn[onclick*="${qid}"])`);
      if(!card) return;
      const btns = card.querySelectorAll('.option-btn');
      btns.forEach((btn, i) => { btn.disabled = true; if (i === correct) btn.classList.add('correct'); else if (i === selected && i !== correct) btn.classList.add('wrong'); });
      const exp = document.getElementById(`exp-${qid}`);
      if (exp) exp.classList.add('show');
    };

    window.toggleAnswer = (qid) => {
      const exp = document.getElementById(`exp-${qid}`) || document.getElementById(`ans-${qid}`);
      if (exp) exp.classList.toggle('show');
    };

    window.checkWord = (qid, answer) => {
      const input = document.getElementById(`word-input-${qid}`).value.trim().toLowerCase();
      const correct = (answer || "").trim().toLowerCase();
      const res = document.getElementById(`res-${qid}`);
      if (input === correct) res.innerHTML = `<span style="color: var(--success); font-weight: 600;">✅ Верно!</span>`;
      else res.innerHTML = `<span style="color: var(--error); font-weight: 600;">❌ Неверно. Ответ: ${answer}</span>`;
    };

    loadData();

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeIcon.textContent = '☀️'; }
    themeToggle.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); themeIcon.textContent = '🌙'; } 
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); themeIcon.textContent = '☀️'; }
    };

    // Волны клик
    const footer = document.getElementById('pondFooter');
    footer.addEventListener('click', (e) => {
      const rect = footer.getBoundingClientRect();
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = (e.clientX - rect.left) + 'px';
      ripple.style.top = (e.clientY - rect.top) + 'px';
      ripple.style.width = '100px'; ripple.style.height = '100px';
      footer.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1200);
    });
  </script>
</body>
</html>
