<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дисциплина | Rain Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-box">🌧️</div>
      <span>Rain Test</span>
    </a>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab">Предметы</a>
      <a href="theory.html" class="nav-tab">Теория</a>
      <a href="tickets.html" class="nav-tab">Билеты</a>
      <a href="progress.html" class="nav-tab">Прогресс</a>
    </div>
    <div class="controls">
      <a href="admin.html" class="icon-btn">⚙️</a>
      <button class="icon-btn" id="themeToggle"><span id="themeIcon">🌙</span></button>
    </div>
  </header>

  <main>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
      <div>
        <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">← Назад к предметам</a>
        <h1 id="title" class="section-title" style="margin-top: 6px;"></h1>
      </div>
      <button class="btn-primary" id="addBtn" style="display: none;" onclick="openForm()">+ Добавить вопрос</button>
    </div>

    <!-- Форма добавления/редактирования -->
    <div id="form-box" class="quiz-card" style="display: none; margin-bottom: 20px;">
      <h2 id="form-title" style="margin-bottom: 20px;">Новый вопрос</h2>
      <input type="hidden" id="edit-id">
      
      <label style="font-weight: 600; display: block; margin-bottom: 8px;">Тема</label>
      <input type="text" id="q-topic" placeholder="Например, ЦНС">
      
      <label style="font-weight: 600; display: block; margin-bottom: 8px;">Тип вопроса</label>
      <select id="q-type">
        <option value="test">Тест (4 варианта)</option>
        <option value="open">Открытый (свободный ответ)</option>
        <option value="word">Вставить слово</option>
        <option value="match">На соответствие</option>
      </select>

      <label style="font-weight: 600; display: block; margin-bottom: 8px;">Текст вопроса</label>
      <textarea id="q-text" rows="3" placeholder="Текст вопроса..."></textarea>

      <div id="fields-test">
        <input type="text" id="opt0" placeholder="Вариант А">
        <input type="text" id="opt1" placeholder="Вариант Б">
        <input type="text" id="opt2" placeholder="Вариант В">
        <input type="text" id="opt3" placeholder="Вариант Г">
        <select id="correct" style="margin-bottom: 12px;">
          <option value="0">Правильный: А</option>
          <option value="1">Правильный: Б</option>
          <option value="2">Правильный: В</option>
          <option value="3">Правильный: Г</option>
        </select>
      </div>

      <div id="fields-word" style="display: none;">
        <input type="text" id="word-answer" placeholder="Правильное слово (ответ)">
      </div>

      <div id="fields-match" style="display: none;">
        <p style="margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Впиши пары (каждую с новой строки через двоеточие):</p>
        <textarea id="match-pairs" rows="4" placeholder="Ощущение: Отражение отдельного свойства&#10;Восприятие: Целостный образ предмета"></textarea>
      </div>

      <label style="font-weight: 600; display: block; margin-bottom: 8px;">Пояснение (необязательно)</label>
      <textarea id="q-explain" rows="2" placeholder="Пояснение..."></textarea>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-primary" onclick="saveQuestion()">Сохранить</button>
        <button class="btn-secondary" onclick="closeForm()">Отмена</button>
      </div>
    </div>

    <div id="content"></div>
  </main>

  <script>
    const SUPABASE_URL = 'https://vgyhmydzbshdjlmbdsbq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Wbus_dDyxCuBBxZrxubw6Q_aQnqMCAM';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const subNames = { obshaya: "Общая психология", istoriya: "История психологии", antropologiya: "Антропология", anatomiya: "Анатомия" };
    const id = new URLSearchParams(location.search).get("id");
    document.getElementById("title").textContent = subNames[id] || "Не найдено";
    
    let questions = [];
    let isAdmin = false;

    db.auth.getSession().then(({ data: { session } }) => {
      if (session) { isAdmin = true; document.getElementById("addBtn").style.display = "block"; }
    });

    async function loadData() {
      const { data, error } = await db.from('questions').select('*').eq('subject', id);
      if (error) { document.getElementById("content").innerHTML = `<p style="color:var(--error)">${error.message}</p>`; return; }
      questions = data;
      render();
    }

    window.openForm = (q = null) => {
      document.getElementById("form-box").style.display = "block";
      document.getElementById("form-title").textContent = q ? "Редактировать вопрос" : "Новый вопрос";
      document.getElementById("edit-id").value = q ? q.id : "";
      document.getElementById("q-topic").value = q ? q.topic : "";
      document.getElementById("q-type").value = q ? q.question_type : "test";
      document.getElementById("q-text").value = q ? q.question_text : "";
      document.getElementById("q-explain").value = q ? q.explanation : "";
      
      document.getElementById("fields-test").style.display = "none";
      document.getElementById("fields-word").style.display = "none";
      document.getElementById("fields-match").style.display = "none";

      if (q && q.question_type === "test") {
        document.getElementById("fields-test").style.display = "block";
        document.getElementById("opt0").value = q.options[0] || "";
        document.getElementById("opt1").value = q.options[1] || "";
        document.getElementById("opt2").value = q.options[2] || "";
        document.getElementById("opt3").value = q.options[3] || "";
        document.getElementById("correct").value = q.correct_answer;
      } else if (q && q.question_type === "word") {
        document.getElementById("fields-word").style.display = "block";
        document.getElementById("word-answer").value = q.metadata?.answer || "";
      } else if (q && q.question_type === "match") {
        document.getElementById("fields-match").style.display = "block";
        document.getElementById("match-pairs").value = q.metadata?.pairs || "";
      } else {
        document.getElementById("fields-test").style.display = "block";
      }
    };

    window.closeForm = () => document.getElementById("form-box").style.display = "none";

    document.getElementById("q-type").onchange = (e) => {
      document.getElementById("fields-test").style.display = e.target.value === "test" ? "block" : "none";
      document.getElementById("fields-word").style.display = e.target.value === "word" ? "block" : "none";
      document.getElementById("fields-match").style.display = e.target.value === "match" ? "block" : "none";
    };

    window.saveQuestion = async () => {
      const editId = document.getElementById("edit-id").value;
      const type = document.getElementById("q-type").value;
      const payload = {
        subject: id,
        topic: document.getElementById("q-topic").value,
        question_type: type,
        question_text: document.getElementById("q-text").value,
        explanation: document.getElementById("q-explain").value
      };

      if (type === "test") {
        payload.options = [document.getElementById("opt0").value, document.getElementById("opt1").value, document.getElementById("opt2").value, document.getElementById("opt3").value];
        payload.correct_answer = parseInt(document.getElementById("correct").value);
      } else if (type === "word") {
        payload.metadata = { answer: document.getElementById("word-answer").value };
      } else if (type === "match") {
        payload.metadata = { pairs: document.getElementById("match-pairs").value };
      }

      if (editId) {
        const { error } = await db.from('questions').update(payload).eq('id', editId);
        if (error) alert(error.message); else { closeForm(); loadData(); }
      } else {
        const { error } = await db.from('questions').insert([payload]);
        if (error) alert(error.message); else { closeForm(); loadData(); }
      }
    };

    window.deleteQuestion = async (qid) => {
      if (!confirm("Удалить вопрос?")) return;
      await db.from('questions').delete().eq('id', qid);
      loadData();
    };

    function render() {
      const content = document.getElementById("content");
      if (!questions.length) { content.innerHTML = "<p>Вопросов пока нет.</p>"; return; }

      content.innerHTML = questions.map(q => {
        const adminBtns = isAdmin ? `
          <div class="admin-actions">
            <button class="mini-btn" onclick='openForm(${JSON.stringify(q).replace(/'/g, "&#39;")})'>✏️</button>
            <button class="mini-btn delete" onclick="deleteQuestion(${q.id})">🗑️</button>
          </div>
        ` : "";

        let innerHTML = "";
        if (q.question_type === "test") {
          innerHTML = `
            <div class="options-list">
              ${q.options.map((opt, i) => `
                <button class="option-btn" onclick="checkTest(this, ${i}, ${q.correct_answer}, ${q.id})">
                  <span class="option-letter">${['А','Б','В','Г'][i]}</span>
                  <span>${opt}</span>
                </button>
              `).join("")}
            </div>
            <div id="exp-${q.id}" class="explanation"><div class="explanation-title">💡 Почему так?</div><div class="explanation-text">${q.explanation || ""}</div></div>
          `;
        } else if (q.question_type === "open") {
          innerHTML = `
            <textarea rows="3" placeholder="Напишите свой вариант..."></textarea>
            <button class="btn-secondary" style="margin-top: 10px;" onclick="toggleAnswer('ans-${q.id}')">Показать ответ</button>
            <div id="ans-${q.id}" class="explanation">
              <div class="explanation-title">Эталонный ответ</div>
              <div class="explanation-text">${q.model_answer || "Нет ответа"}</div>
            </div>
          `;
        } else if (q.question_type === "word") {
          innerHTML = `
            <input type="text" id="word-input-${q.id}" placeholder="Введите слово...">
            <button class="btn-secondary" onclick="checkWord(${q.id}, '${q.metadata?.answer}')">Проверить</button>
            <div id="res-${q.id}" style="margin-top: 10px;"></div>
          `;
        } else if (q.question_type === "match") {
          const pairs = (q.metadata?.pairs || "").split("\n").filter(l => l.includes(":"));
          innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;">
              ${pairs.map((p, i) => {
                const [left, right] = p.split(":");
                return `<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                  <span style="flex: 1; font-weight: 500; min-width: 100px;">${left.trim()}</span>
                  <input type="text" id="match-${q.id}-${i}" placeholder="Ваш ответ..." style="flex: 1;">
                </div>`;
              }).join("")}
            </div>
            <button class="btn-secondary" onclick="toggleAnswer('ans-${q.id}')">Показать правильные ответы</button>
            <div id="ans-${q.id}" class="explanation">
              ${pairs.map(p => `<div>${p.replace(":", " — ")}</div>`).join("")}
            </div>
          `;
        }

        return `
          <div class="quiz-card">
            ${adminBtns}
            <span class="subject-tag">${q.topic || "Разное"}</span>
            <h2 class="question-text">${q.question_text}</h2>
            ${innerHTML}
          </div>
        `;
      }).join("");
    }

    window.checkTest = (btn, selected, correct, qid) => {
      const card = btn.closest('.quiz-card');
      const btns = card.querySelectorAll('.option-btn');
      btns.forEach((b, i) => {
        b.disabled = true;
        if (i === correct) b.classList.add('correct');
        else if (i === selected && i !== correct) b.classList.add('wrong');
      });
      document.getElementById(`exp-${qid}`).classList.add('show');
    };

    window.toggleAnswer = (id) => {
      document.getElementById(id).classList.toggle('show');
    };

    window.checkWord = (qid, answer) => {
      const input = document.getElementById(`word-input-${qid}`).value.trim().toLowerCase();
      const correct = (answer || "").trim().toLowerCase();
      const res = document.getElementById(`res-${qid}`);
      if (input === correct) {
        res.innerHTML = `<span style="color: var(--success); font-weight: 600;">✅ Верно!</span>`;
      } else {
        res.innerHTML = `<span style="color: var(--error); font-weight: 600;">❌ Неверно. Правильный ответ: ${answer}</span>`;
      }
    };

    loadData();

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeIcon.textContent = '☀️'; }
    themeToggle.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); themeIcon.textContent = '🌙'; } 
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); themeIcon.textContent = '☀️'; }
    };
  </script>
</body>
</html>
