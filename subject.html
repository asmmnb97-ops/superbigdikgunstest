<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дисциплина</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo-box">
      <svg class="medusa-svg" viewBox="0 0 100 100">
        <path d="M20 50 Q20 20 50 20 Q80 20 80 50" class="medusa-head"/>
        <path d="M30 50 Q25 70 35 90" class="medusa-tentacle"/>
        <path d="M50 50 Q45 80 55 95" class="medusa-tentacle"/>
        <path d="M70 50 Q75 70 65 90" class="medusa-tentacle"/>
      </svg>
      <div class="logo-title">Neural<span>Drift</span></div>
    </div>
    <nav>
      <a href="index.html">Дисциплины</a>
      <a href="tickets.html">Билеты</a>
      <a href="progress.html">Прогресс</a>
    </nav>
  </aside>

  <div class="main-content">
    <header>
      <a href="index.html" class="back-link">← Назад</a>
      <h1 id="title"></h1>
    </header>

    <div class="controls">
      <div class="tabs">
        <button id="tab-test" class="active">Тесты</button>
        <button id="tab-open">Открытые</button>
        <button id="tab-fav">Избранное</button>
      </div>
      <div class="tools">
        <select id="topic-filter"><option value="">Все темы</option></select>
        <input id="search-input" type="text" placeholder="Поиск...">
      </div>
    </div>

    <main id="content"></main>
  </div>
  <button id="scroll-top">↑</button>

  <script src="data.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const subject = subjects.find(s => s.id === id);
    document.getElementById("title").textContent = subject ? subject.name : "Не найдено";
    
    const rawData = questions[id] || {};
    const data = { test: rawData.test || [], open: rawData.open || [] };

    const content = document.getElementById("content");
    const tabTest = document.getElementById("tab-test");
    const tabOpen = document.getElementById("tab-open");
    const tabFav = document.getElementById("tab-fav");
    const topicFilter = document.getElementById("topic-filter");
    const searchInput = document.getElementById("search-input");

    let currentTab = "test";

    // --- Управление прогрессом (изученные вопросы) ---
    function markLearned(qid, type) {
      let learned = JSON.parse(localStorage.getItem("learned") || "{}");
      if (!learned[id]) learned[id] = { test: [], open: [] };
      if (!learned[id][type].includes(qid)) {
        learned[id][type].push(qid);
        localStorage.setItem("learned", JSON.stringify(learned));
      }
    }
    function isLearned(qid, type) {
      let learned = JSON.parse(localStorage.getItem("learned") || "{}");
      return learned[id] && learned[id][type] && learned[id][type].includes(qid);
    }

    // --- Избранное ---
    function toggleFav(qid) {
      let favs = JSON.parse(localStorage.getItem("favorites") || "[]");
      if (favs.includes(qid)) favs = favs.filter(f => f !== qid);
      else favs.push(qid);
      localStorage.setItem("favorites", JSON.stringify(favs));
      return favs.includes(qid);
    }
    function isFav(qid) {
      let favs = JSON.parse(localStorage.getItem("favorites") || "[]");
      return favs.includes(qid);
    }

    function fillTopics() {
      const source = currentTab === "test" ? data.test : (currentTab === "open" ? data.open : [...data.test, ...data.open]);
      let topics = [...new Set(source.map(q => q.topic ? q.topic.trim() : "Разное"))];
      topics = topics.filter(t => t !== "");
      topicFilter.innerHTML = `<option value="">Все темы</option>` + topics.map(t => `<option value="${t}">${t}</option>`).join("");
    }

    function getFilteredItems() {
      let source = [];
      if (currentTab === "test") source = data.test;
      else if (currentTab === "open") source = data.open;
      else source = [...data.test, ...data.open].filter(item => isFav(item.id)); // Только избранные

      const topic = topicFilter.value;
      const query = searchInput.value.toLowerCase().trim();
      
      return source.filter(item => {
        const itemTopic = item.topic ? item.topic.trim() : "Разное";
        const matchTopic = !topic || itemTopic.toLowerCase() === topic.toLowerCase();
        const matchQuery = !query || (item.q && item.q.toLowerCase().includes(query));
        return matchTopic && matchQuery;
      });
    }

    // Логика оценок открытых
    function updateScore(points, questionId) {
      let scores = JSON.parse(localStorage.getItem("scores") || "{}");
      let history = JSON.parse(localStorage.getItem("score_history") || "{}");
      if (!scores[id]) scores[id] = 0;
      if (history[questionId]) scores[id] -= history[questionId];
      scores[id] += points;
      history[questionId] = points;
      if (scores[id] < 0) scores[id] = 0;
      localStorage.setItem("scores", JSON.stringify(scores));
      localStorage.setItem("score_history", JSON.stringify(history));
    }

    function render() {
      fillTopics();
      const items = getFilteredItems();
      
      if (!items.length) { 
        content.innerHTML = "<p style='opacity:0.6'>В этой категории пока нет вопросов.</p>"; 
        return; 
      }

      content.innerHTML = items.map((item, i) => {
        const uid = item.id || "q_" + i + "_" + Math.random().toString(36).substr(2, 5);
        const favActive = isFav(uid) ? "active" : "";
        const star = `<button class="fav-btn ${favActive}" data-uid="${uid}">★</button>`;

        if (currentTab === "test" || (currentTab === "fav" && item.options)) {
          return `
          <div class="question">
            ${star}
            <p><span class="topic-badge">${item.topic || "Разное"}</span></p>
            <p><b>${item.q}</b></p>
            ${item.options.map((opt, j) => `<label><input type="radio" name="q_${uid}" value="${j}"> ${opt}</label>`).join("")}
            <button class="check-one" data-uid="${uid}" data-idx="${i}">Проверить</button>
            <div class="feedback" id="fb_${uid}"></div>
          </div>`;
        } else {
          return `
          <div class="open-q">
            ${star}
            <p><span class="topic-badge">${item.topic || "Разное"}</span></p>
            <p><b>${item.q}</b></p>
            <textarea rows="4" placeholder="Напишите свой вариант..."></textarea>
            <button class="show-answer" data-uid="${uid}">Показать примерный ответ</button>
            <div class="model-answer" id="ma_${uid}" style="display:none">
              <p><b>Примерный ответ:</b> ${item.answer || "Ответ не добавлен"}</p>
              <div class="grade-box">
                <span>Оцените свой ответ (1-5):</span>
                <div class="grade-buttons" id="grades_${uid}">
                  ${[1,2,3,4,5].map(n => `<button class="grade-btn" data-uid="${uid}" data-val="${n}">${n}</button>`).join("")}
                </div>
                <span class="grade-status" id="status_${uid}"></span>
              </div>
            </div>
          </div>`;
        }
      }).join("");

      // Слушатели для звездочек
      document.querySelectorAll(".fav-btn").forEach(btn => {
        btn.onclick = () => {
          const uid = btn.dataset.uid;
          const active = toggleFav(uid);
          btn.classList.toggle("active", active);
        };
      });

      // Слушатели для проверки тестов
      document.querySelectorAll(".check-one").forEach(btn => {
        btn.onclick = () => {
          const uid = btn.dataset.uid;
          const idx = +btn.dataset.idx;
          const item = items[idx];
          const chosen = document.querySelector(`input[name="q_${uid}"]:checked`);
          const fb = document.getElementById("fb_" + uid);
          if (!chosen) { fb.innerHTML = `<p class="bad">Выберите ответ.</p>`; return; }
          
          const ok = +chosen.value === item.correct;
          if (ok) { 
            updateScore(1, uid); 
            markLearned(uid, "test"); // Отмечаем как изученное
          }
          
          fb.innerHTML = `
            <p class="${ok ? "ok" : "bad"}">${ok ? "Верно (+1 балл)" : "Неверно"}</p>
            <p class="explain">${item.explain || ""}</p>
          `;
        };
      });

      // Слушатели для открытых
      document.querySelectorAll(".show-answer").forEach(btn => {
        btn.onclick = () => {
          const uid = btn.dataset.uid;
          const box = document.getElementById("ma_" + uid);
          box.style.display = box.style.display === "none" ? "block" : "none";
          btn.textContent = box.style.display === "none" ? "Показать примерный ответ" : "Скрыть ответ";
        };
      });

      document.querySelectorAll(".grade-btn").forEach(btn => {
        btn.onclick = () => {
          const uid = btn.dataset.uid;
          const val = +btn.dataset.val;
          updateScore(val, uid); 
          markLearned(uid, "open"); // Отмечаем как изученное
          
          const parent = document.getElementById("grades_" + uid);
          parent.querySelectorAll(".grade-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("status_" + uid).textContent = `Оценка: ${val}`;
        };
      });
    }

    topicFilter.onchange = render;
    searchInput.oninput = render;

    tabTest.onclick = () => { currentTab = "test"; tabTest.classList.add("active"); tabOpen.classList.remove("active"); tabFav.classList.remove("active"); render(); };
    tabOpen.onclick = () => { currentTab = "open"; tabOpen.classList.add("active"); tabTest.classList.remove("active"); tabFav.classList.remove("active"); render(); };
    tabFav.onclick = () => { currentTab = "fav"; tabFav.classList.add("active"); tabTest.classList.remove("active"); tabOpen.classList.remove("active"); render(); };

    render();

    const scrollBtn = document.getElementById("scroll-top");
    window.onscroll = () => scrollBtn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  </script>
</body>
</html>
