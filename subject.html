<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дисциплина | Rain Test</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="logo-box">
      <svg class="medusa-svg-small" viewBox="0 0 100 100">
        <path class="medusa-head" d="M 20 48 C 20 18, 80 18, 80 48 C 65 54, 35 54, 20 48 Z" />
        <path class="medusa-tentacle" d="M 32 51 Q 26 68, 34 86" />
        <path class="medusa-tentacle" d="M 44 53 Q 40 72, 46 92" />
        <path class="medusa-tentacle" d="M 56 53 Q 60 72, 54 92" />
        <path class="medusa-tentacle" d="M 68 51 Q 74 68, 66 86" />
      </svg>
      <div class="logo-title">Rain<span>Test</span></div>
    </div>
    <nav>
      <a href="index.html">Дисциплины</a>
      <a href="theory.html">Теория</a>
      <a href="tickets.html">Билеты</a>
      <a href="progress.html">Прогресс</a>
      <a href="admin.html">Панель</a>
    </nav>
  </aside>

  <div class="main-content">
    <header>
      <div>
        <a href="index.html" class="back-link">← Назад</a>
        <h1 id="title"></h1>
      </div>
      <button class="theme-btn" id="theme-btn">🌙</button>
    </header>

    <div id="admin-actions" style="display: none; margin-bottom: 20px;">
      <button class="btn-primary" onclick="openAddForm()">+ Добавить вопрос</button>
    </div>

    <div id="add-form" class="question" style="display: none; max-width: 600px; margin-bottom: 20px;">
      <h3>Новый вопрос</h3>
      <input type="text" id="add-topic" placeholder="Тема" style="width: 100%; margin-bottom: 10px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
      <select id="add-type" style="width: 100%; margin-bottom: 10px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
        <option value="test">Тестовый</option>
        <option value="open">Открытый</option>
      </select>
      <textarea id="add-qtext" placeholder="Текст вопроса" rows="2" style="width: 100%; margin-bottom: 10px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);"></textarea>
      
      <div id="add-test-fields">
        <input type="text" id="add-opt0" placeholder="Вариант А" style="width: 100%; margin-bottom: 5px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
        <input type="text" id="add-opt1" placeholder="Вариант Б" style="width: 100%; margin-bottom: 5px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
        <input type="text" id="add-opt2" placeholder="Вариант В" style="width: 100%; margin-bottom: 5px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
        <input type="text" id="add-opt3" placeholder="Вариант Г" style="width: 100%; margin-bottom: 5px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
        <select id="add-correct" style="width: 100%; margin-bottom: 10px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
          <option value="0">Правильный: А</option>
          <option value="1">Правильный: Б</option>
          <option value="2">Правильный: В</option>
          <option value="3">Правильный: Г</option>
        </select>
        <textarea id="add-explain" placeholder="Пояснение" rows="2" style="width: 100%; margin-bottom: 10px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);"></textarea>
      </div>

      <div id="add-open-fields" style="display: none;">
        <textarea id="add-model" placeholder="Эталонный ответ" rows="2" style="width: 100%; margin-bottom: 10px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);"></textarea>
      </div>

      <button class="btn-primary" onclick="saveNewQuestion()">Сохранить</button>
      <button class="btn-primary" onclick="closeAddForm()" style="background: var(--muted); color: var(--text);">Отмена</button>
    </div>

    <div class="controls">
      <div class="tabs">
        <button id="tab-test" class="active">Тесты</button>
        <button id="tab-open">Открытые</button>
        <button id="tab-fav">Избранное</button>
      </div>
      <div class="tools">
        <select id="topic-filter"><option value="">Все темы</option></select>
        <input id="search-input" type="text" placeholder="Поиск...">
      </div>
    </div>

    <main id="content"><p style="padding: 20px;">Загрузка...</p></main>
  </div>
  <button id="scroll-top">↑</button>

  <script>
    const SUPABASE_URL = 'https://vgyhmydzbshdjlmbdsbq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Wbus_dDyxCuBBxZrxubw6Q_aQnqMCAM';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const subNames = { obshaya: "Общая психология", istoriya: "История психологии", antropologiya: "Антропология", anatomiya: "Анатомия" };
    const id = new URLSearchParams(location.search).get("id");
    document.getElementById("title").textContent = subNames[id] || "Не найдено";
    
    let data = { test: [], open: [] };
    let isAdmin = false;
    const content = document.getElementById("content");
    const adminActions = document.getElementById("admin-actions");

    db.auth.getSession().then(({ data: { session } }) => {
      if (session) { isAdmin = true; adminActions.style.display = "block"; }
    });

    async function loadData() {
      const { data: rows, error } = await db.from('questions').select('*').eq('subject', id);
      if (error) { content.innerHTML = `<p class="bad">Ошибка: ${error.message}</p>`; return; }
      data.test = rows.filter(r => r.question_type === 'test').map(r => ({ id: r.id, topic: r.topic, q: r.question_text, options: r.options, correct: r.correct_answer, explain: r.explanation }));
      data.open = rows.filter(r => r.question_type === 'open').map(r => ({ id: r.id, topic: r.topic, q: r.question_text, answer: r.model_answer }));
      render();
    }

    window.openAddForm = () => document.getElementById("add-form").style.display = "block";
    window.closeAddForm = () => document.getElementById("add-form").style.display = "none";
    
    document.getElementById("add-type").onchange = (e) => {
      document.getElementById("add-test-fields").style.display = e.target.value === "test" ? "block" : "none";
      document.getElementById("add-open-fields").style.display = e.target.value === "open" ? "block" : "none";
    };

    window.saveNewQuestion = async () => {
      const type = document.getElementById("add-type").value;
      const payload = {
        subject: id, topic: document.getElementById("add-topic").value,
        question_type: type, question_text: document.getElementById("add-qtext").value
      };
      if (type === "test") {
        payload.options = [
          document.getElementById("add-opt0").value, 
          document.getElementById("add-opt1").value, 
          document.getElementById("add-opt2").value,
          document.getElementById("add-opt3").value
        ];
        payload.correct_answer = parseInt(document.getElementById("add-correct").value);
        payload.explanation = document.getElementById("add-explain").value;
      } else {
        payload.model_answer = document.getElementById("add-model").value;
      }
      const { error } = await db.from('questions').insert([payload]);
      if (error) alert("Ошибка: " + error.message);
      else { closeAddForm(); loadData(); }
    };

    window.deleteQuestion = async (qid) => {
      if(!confirm("Удалить вопрос?")) return;
      const { error } = await db.from('questions').delete().eq('id', qid);
      if(error) alert("Ошибка: " + error.message);
      else loadData();
    };

    function render() {
      const topicFilter = document.getElementById("topic-filter");
      const searchInput = document.getElementById("search-input");
      const currentTab = document.querySelector(".tabs button.active").id.replace("tab-", "");
      
      const source = currentTab === "test" ? data.test : (currentTab === "open" ? data.open : [...data.test, ...data.open]);
      let topics = [...new Set(source.map(q => q.topic || "Разное"))].filter(t => t);
      topicFilter.innerHTML = `<option value="">Все темы</option>` + topics.map(t => `<option value="${t}">${t}</option>`).join("");

      const query = searchInput.value.toLowerCase().trim();
      const items = source.filter(item => {
        const matchTopic = !topicFilter.value || (item.topic || "Разное") === topicFilter.value;
        const matchQuery = !query || item.q.toLowerCase().includes(query);
        return matchTopic && matchQuery;
      });

      if (!items.length) { content.innerHTML = "<p style='opacity:0.6; padding: 20px;'>В этой категории пока нет вопросов.</p>"; return; }

      content.innerHTML = items.map((item, i) => {
        const editBtn = isAdmin ? `<button class="btn-primary" style="padding:4px 8px; font-size:12px; float:right; margin-left:5px; background:var(--bad); border-color:var(--bad);" onclick="deleteQuestion(${item.id})">Удалить</button>` : "";
        
        if (currentTab === "test" || (currentTab === "fav" && item.options)) {
          return `
          <div class="question">
            ${editBtn}
            <p><span class="topic-badge">${item.topic || "Разное"}</span></p>
            <p><b>${item.q}</b></p>
            ${item.options.map((opt, j) => `<label><input type="radio" name="q_${item.id}" value="${j}"> ${opt}</label>`).join("")}
            <button class="check-one" onclick="checkAnswer(${item.id}, ${item.correct}, '${item.explain}')">Проверить</button>
            <div class="feedback" id="fb_${item.id}"></div>
          </div>`;
        } else {
          return `
          <div class="open-q">
            ${editBtn}
            <p><span class="topic-badge">${item.topic || "Разное"}</span></p>
            <p><b>${item.q}</b></p>
            <textarea rows="3"></textarea>
            <button class="show-answer" onclick="toggleAnswer(${item.id})">Показать ответ</button>
            <div class="model-answer" id="ma_${item.id}" style="display:none">
              <p><b>Примерный ответ:</b> ${item.answer}</p>
            </div>
          </div>`;
        }
      }).join("");
    }

    window.checkAnswer = (qid, correct, explain) => {
      const chosen = document.querySelector(`input[name="q_${qid}"]:checked`);
      const fb = document.getElementById("fb_" + qid);
      if (!chosen) { fb.innerHTML = `<p class="bad">Выберите ответ.</p>`; return; }
      const ok = +chosen.value === correct;
      fb.innerHTML = `<p class="${ok ? "ok" : "bad"}">${ok ? "Верно!" : "Неверно"}</p><p class="explain">${explain}</p>`;
    };

    window.toggleAnswer = (qid) => {
      const box = document.getElementById("ma_" + qid);
      box.style.display = box.style.display === "none" ? "block" : "none";
    };

    document.getElementById("topic-filter").onchange = render;
    document.getElementById("search-input").oninput = render;
    
    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      };
    });

    loadData();

    const btnTheme = document.getElementById("theme-btn");
    if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark"); btnTheme.innerHTML = "☀️"; }
    btnTheme.onclick = () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
      btnTheme.innerHTML = document.body.classList.contains("dark") ? "☀️" : "🌙";
    };
  </script>
</body>
</html>
