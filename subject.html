<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дисциплина</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo-cat" id="logo-cat">
      <svg viewBox="0 0 100 100" class="cat-svg">
        <path d="M20 50 L25 20 L45 35 L55 35 L75 20 L80 50 Q90 80 50 85 Q10 80 20 50 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="40" cy="55" r="5" fill="none" stroke="currentColor" stroke-width="2" class="cat-eye"/>
        <circle cx="60" cy="55" r="5" fill="none" stroke="currentColor" stroke-width="2" class="cat-eye"/>
        <circle cx="40" cy="55" r="2" fill="currentColor" class="pupil"/>
        <circle cx="60" cy="55" r="2" fill="currentColor" class="pupil"/>
        <path d="M50 65 L45 70 M50 65 L55 70" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <nav>
      <a href="index.html">Дисциплины</a>
      <a href="rating.html">Рейтинг</a>
    </nav>
  </aside>

  <div class="main-content">
    <header>
      <a href="index.html" class="back-link">← Назад</a>
      <h1 id="title"></h1>
      <button class="theme-btn" id="theme-btn"></button>
    </header>

    <div class="controls">
      <div class="tabs">
        <button id="tab-test" class="active">Тесты</button>
        <button id="tab-open">Открытые</button>
      </div>
      <div class="tools">
        <select id="topic-filter"><option value="">Все темы</option></select>
        <input id="search-input" type="text" placeholder="Поиск...">
        <button id="btn-shuffle" title="Перемешать">⤨</button>
        <button id="btn-random" title="Случайные 5">⚄</button>
      </div>
    </div>

    <main id="content"></main>
  </div>

  <button id="scroll-top">↑</button>

  <script src="data.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const subject = subjects.find(s => s.id === id);
    document.getElementById("title").textContent = subject ? subject.name : "Не найдено";
    
    const rawData = questions[id] || {};
    const data = { test: rawData.test || [], open: rawData.open || [] };

    const content = document.getElementById("content");
    const tabTest = document.getElementById("tab-test");
    const tabOpen = document.getElementById("tab-open");
    const topicFilter = document.getElementById("topic-filter");
    const searchInput = document.getElementById("search-input");
    const btnShuffle = document.getElementById("btn-shuffle");
    const btnRandom = document.getElementById("btn-random");

    let currentTab = "test";
    let isShuffled = false;
    let limitRandom = 0;

    function shuffle(arr) {
      let a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function fillTopics() {
      const source = currentTab === "test" ? data.test : data.open;
      const topics = [...new Set(source.map(q => q.topic ? q.topic.trim() : "Разное"))];
      topicFilter.innerHTML = `<option value="">Все темы</option>` + topics.map(t => `<option value="${t}">${t}</option>`).join("");
    }

    function getFilteredItems() {
      const source = currentTab === "test" ? data.test : data.open;
      const topic = topicFilter.value;
      const query = searchInput.value.toLowerCase().trim();
      
      let filtered = source.filter(item => {
        const itemTopic = item.topic ? item.topic.trim() : "Разное";
        const matchTopic = !topic || itemTopic === topic;
        const matchQuery = !query || (item.q && item.q.toLowerCase().includes(query));
        return matchTopic && matchQuery;
      });

      if (isShuffled) filtered = shuffle(filtered);
      if (limitRandom > 0) filtered = filtered.slice(0, limitRandom);
      return filtered;
    }

    function addScore(points) {
      let scores = JSON.parse(localStorage.getItem("scores") || "{}");
      scores[id] = (scores[id] || 0) + points;
      localStorage.setItem("scores", JSON.stringify(scores));
    }

    function renderTest() {
      currentTab = "test";
      fillTopics();
      const items = getFilteredItems();
      if (!items.length) { content.innerHTML = "<p style='opacity:0.6'>В этой категории пока нет вопросов.</p>"; return; }

      content.innerHTML = items.map((item, i) => {
        const uid = item.id || "q_" + i + "_" + Math.random().toString(36).substr(2, 5);
        return `
        <div class="question">
          <p><span class="topic-badge">${item.topic || "Разное"}</span></p>
          <p><b>${item.q || "Вопрос без текста"}</b></p>
          ${item.options ? item.options.map((opt, j) => `<label><input type="radio" name="q_${uid}" value="${j}"> ${opt}</label>`).join("") : ""}
          <button class="check-one" data-uid="${uid}" data-idx="${i}">Проверить</button>
          <div class="feedback" id="fb_${uid}"></div>
        </div>
      `}).join("");

      document.querySelectorAll(".check-one").forEach(btn => {
        btn.onclick = () => {
          const uid = btn.dataset.uid;
          const idx = +btn.dataset.idx;
          const item = items[idx];
          const chosen = document.querySelector(`input[name="q_${uid}"]:checked`);
          const fb = document.getElementById("fb_" + uid);
          if (!chosen) { fb.innerHTML = `<p class="bad">Выберите ответ.</p>`; return; }
          
          const ok = +chosen.value === item.correct;
          if (ok) addScore(1); 
          
          fb.innerHTML = `
            <p class="${ok ? "ok" : "bad"}">${ok ? "Верно (+1 балл)" : "Неверно"}</p>
            <p class="explain">${item.explain || ""}</p>
          `;
        };
      });
    }

    function renderOpen() {
      currentTab = "open";
      fillTopics();
      const items = getFilteredItems();
      if (!items.length) { content.innerHTML = "<p style='opacity:0.6'>В этой категории пока нет вопросов.</p>"; return; }

      content.innerHTML = items.map((item, i) => {
        const uid = item.id || "o_" + i + "_" + Math.random().toString(36).substr(2, 5);
        return `
        <div class="open-q">
          <p><span class="topic-badge">${item.topic || "Разное"}</span></p>
          <p><b>${item.q || "Вопрос без текста"}</b></p>
          <textarea rows="4" placeholder="Напишите свой вариант..."></textarea>
          <button class="show-answer" data-uid="${uid}">Показать примерный ответ</button>
          <div class="model-answer" id="ma_${uid}" style="display:none">
            <p><b>Примерный ответ:</b> ${item.answer || "Ответ не добавлен"}</p>
            <div class="grade-box">
              <span>Оцените свой ответ (1-5):</span>
              <div class="grade-buttons">
                ${[1,2,3,4,5].map(n => `<button class="grade-btn" data-val="${n}">${n}</button>`).join("")}
              </div>
            </div>
          </div>
        </div>
      `}).join("");

      document.querySelectorAll(".show-answer").forEach(btn => {
        btn.onclick = () => {
          const uid = btn.dataset.uid;
          const box = document.getElementById("ma_" + uid);
          box.style.display = box.style.display === "none" ? "block" : "none";
          btn.textContent = box.style.display === "none" ? "Показать примерный ответ" : "Скрыть ответ";
        };
      });

      document.querySelectorAll(".grade-btn").forEach(btn => {
        btn.onclick = () => {
          const val = +btn.dataset.val;
          addScore(val); 
          const parent = btn.parentElement;
          parent.innerHTML = `<span style="color:var(--ok); font-weight:bold;">Оценено на ${val} баллов</span>`;
        };
      });
    }

    topicFilter.onchange = () => currentTab === "test" ? renderTest() : renderOpen();
    searchInput.oninput = () => currentTab === "test" ? renderTest() : renderOpen();
    btnShuffle.onclick = () => { isShuffled = !isShuffled; btnShuffle.classList.toggle("active"); currentTab === "test" ? renderTest() : renderOpen(); };
    btnRandom.onclick = () => { limitRandom = limitRandom > 0 ? 0 : 5; btnRandom.classList.toggle("active"); currentTab === "test" ? renderTest() : renderOpen(); };

    tabTest.onclick = () => { tabTest.classList.add("active"); tabOpen.classList.remove("active"); renderTest(); };
    tabOpen.onclick = () => { tabOpen.classList.add("active"); tabTest.classList.remove("active"); renderOpen(); };

    renderTest();

    const btnTheme = document.getElementById("theme-btn");
    if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark"); btnTheme.innerHTML = "☀️"; } 
    else { btnTheme.innerHTML = "🌙"; }
    btnTheme.onclick = () => { 
      document.body.classList.toggle("dark"); 
      const isDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light"); 
      btnTheme.innerHTML = isDark ? "☀️" : "🌙";
    };

    const scrollBtn = document.getElementById("scroll-top");
    window.onscroll = () => scrollBtn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    const cat = document.getElementById("logo-cat");
    const pupils = document.querySelectorAll(".pupil");
    const eyes = document.querySelectorAll(".cat-eye");
    document.addEventListener("mousemove", (e) => {
      if(!cat) return;
      const rect = cat.getBoundingClientRect();
      const catX = rect.left + rect.width / 2;
      const catY = rect.top + rect.height / 2;
      const angle = Math.atan2(e.clientY - catY, e.clientX - catX);
      pupils.forEach(p => p.style.transform = `translate(${Math.cos(angle) * 6}px, ${Math.sin(angle) * 6}px)`);
    });
    setInterval(() => {
      eyes.forEach(eye => { eye.style.transition = "transform 0.1s"; eye.style.transform = "scaleY(0.1)"; });
      setTimeout(() => { eyes.forEach(eye => eye.style.transform = "scaleY(1)"); }, 150);
    }, 4000);
  </script>
</body>
</html>
