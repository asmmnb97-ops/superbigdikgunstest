<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Билеты | Jelly Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo-box">
      <svg class="medusa-svg" viewBox="0 0 100 100">
        <path d="M20 50 Q20 20 50 20 Q80 20 80 50" class="medusa-head"/>
        <path d="M30 50 Q25 70 35 90" class="medusa-tentacle"/>
        <path d="M50 50 Q45 80 55 95" class="medusa-tentacle"/>
        <path d="M70 50 Q75 70 65 90" class="medusa-tentacle"/>
      </svg>
      <div class="logo-title">Jelly<span>Test</span></div>
    </div>
    <nav>
      <a href="index.html">Дисциплины</a>
      <a href="tickets.html" class="active">Билеты</a>
      <a href="progress.html">Прогресс</a>
    </nav>
  </aside>

  <div class="main-content">
    <header>
      <h1>Генератор билетов</h1>
      <button class="theme-btn" id="theme-btn">🌙</button>
    </header>
    <main>
      <div class="controls">
        <select id="ticket-subject">
          <option value="">Выберите дисциплину</option>
        </select>
        <input type="number" id="ticket-count" value="3" min="1" max="10" style="width: 80px;" title="Кол-во вопросов">
        <button class="btn-primary" id="gen-ticket">Сгенерировать</button>
      </div>

      <div id="ticket-result"></div>
    </main>
  </div>
  <button id="scroll-top">↑</button>

  <script src="data.js"></script>
  <script>
    const subSelect = document.getElementById("ticket-subject");
    subjects.forEach(s => {
      subSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
    });

    // Функция перемешивания
    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    document.getElementById("gen-ticket").onclick = () => {
      const subId = subSelect.value;
      const count = +document.getElementById("ticket-count").value;
      const resultBox = document.getElementById("ticket-result");

      if (!subId) { resultBox.innerHTML = "<p class='bad'>Выберите дисциплину!</p>"; return; }
      
      const subData = questions[subId] || { open: [] };
      let pool = subData.open || [];
      
      if (pool.length === 0) { resultBox.innerHTML = "<p class='bad'>Нет открытых вопросов.</p>"; return; }

      // ГРУППИРОВКА ПО ТЕМАМ (чтобы были вопросы из разных тем)
      const topicsMap = {};
      pool.forEach(q => {
        const t = q.topic || "Разное";
        if (!topicsMap[t]) topicsMap[t] = [];
        topicsMap[t].push(q);
      });

      const topics = Object.keys(topicsMap);
      const selectedQuestions = [];
      
      // Берем по одному вопросу из каждой темы, пока не наберем нужное количество
      shuffle(topics); // Перемешиваем темы
      let topicIndex = 0;
      
      while (selectedQuestions.length < count && topics.length > 0) {
        // Если темы закончились, но нужно больше вопросов, начинаем заново
        if (topicIndex >= topics.length) {
          topicIndex = 0;
          shuffle(topics); // Перемешиваем заново, чтобы не было повторов
        }
        
        const currentTopic = topics[topicIndex];
        const topicQuestions = topicsMap[currentTopic];
        
        if (topicQuestions.length > 0) {
          // Берем случайный вопрос из этой темы
          const randomIndex = Math.floor(Math.random() * topicQuestions.length);
          selectedQuestions.push(topicQuestions[randomIndex]);
          topicQuestions.splice(randomIndex, 1); // Удаляем, чтобы не повторялся
        }
        
        topicIndex++;
        
        // Если все темы опустели, выходим
        if (Object.values(topicsMap).every(arr => arr.length === 0)) break;
      }

      // Формируем HTML
      let html = `<div class="ticket-card"><h3>Ваш билет (${selectedQuestions.length} вопр.)</h3>`;
      selectedQuestions.forEach((q, i) => {
        html += `
          <div class="ticket-q">
            <b>${i+1}.</b> <span style="font-size:12px; color:var(--accent); text-transform:uppercase;">[${q.topic || "Разное"}]</span><br>
            ${q.q}
            <div class="ticket-answer" id="ans_${i}">
              <b>Примерный ответ:</b> ${q.answer || "Нет ответа"}
            </div>
          </div>
        `;
      });
      html += `<button class="btn-primary" id="show-answers" style="margin-top:20px;">Показать ответы</button></div>`;
      
      resultBox.innerHTML = html;

      // Логика показа ответов
      document.getElementById("show-answers").onclick = () => {
        const answers = document.querySelectorAll(".ticket-answer");
        const btn = document.getElementById("show-answers");
        let isHidden = answers[0].style.display === "none" || answers[0].style.display === "";
        
        answers.forEach(a => a.style.display = isHidden ? "block" : "none");
        btn.textContent = isHidden ? "Скрыть ответы" : "Показать ответы";
      };
    };

    // Кнопка темы
    const btn = document.getElementById("theme-btn");
    const isDark = localStorage.getItem("theme") === "dark";
    if (isDark) { document.body.classList.add("dark"); btn.innerHTML = "☀️"; }
    btn.onclick = () => {
      document.body.classList.toggle("dark");
      const nowDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", nowDark ? "dark" : "light");
      btn.innerHTML = nowDark ? "☀️" : "🌙";
    };

    const scrollBtn = document.getElementById("scroll-top");
    window.onscroll = () => scrollBtn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  </script>
</body>
</html>
