<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Билеты | Rain Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><div class="logo-box">🌧️</div><span>Rain Test</span></a>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab">Предметы</a>
      <a href="theory.html" class="nav-tab">Теория</a>
      <a href="tickets.html" class="nav-tab active">Билеты</a>
      <a href="progress.html" class="nav-tab">Прогресс</a>
    </div>
    <div class="controls"><a href="admin.html" class="icon-btn">⚙️</a><button class="icon-btn" id="themeToggle"><span id="themeIcon">🌙</span></button></div>
  </header>

  <main>
    <h1 class="section-title">Генератор билетов</h1>
    <p class="section-subtitle">Случайные вопросы из разных тем для подготовки</p>
    
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
      <select id="ticket-subject" style="flex: 1; min-width: 200px; margin: 0;">
        <option value="anatomiya">Анатомия</option>
        <option value="obshaya">Общая психология</option>
        <option value="istoriya">История психологии</option>
        <option value="antropologiya">Антропология</option>
      </select>
      <input type="number" id="ticket-count" value="3" min="1" max="10" style="width: 80px; margin: 0;" title="Кол-во вопросов">
      <button class="btn-primary" id="gen-ticket">Сгенерировать</button>
    </div>
    <div id="ticket-result"></div>
  </main>

  <script>
    const SUPABASE_URL = 'https://vgyhmydzbshdjlmbdsbq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Wbus_dDyxCuBBxZrxubw6Q_aQnqMCAM';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    document.getElementById("gen-ticket").onclick = async () => {
      const subId = document.getElementById("ticket-subject").value;
      const count = +document.getElementById("ticket-count").value;
      const resultBox = document.getElementById("ticket-result");
      resultBox.innerHTML = "<p>Формируем билет...</p>";
      
      const { data: pool, error } = await db.from('questions').select('*').eq('subject', subId).eq('question_type', 'open');
      if (error) { resultBox.innerHTML = `<p style="color:var(--error)">Ошибка: ${error.message}</p>`; return; }
      if (!pool || pool.length === 0) { resultBox.innerHTML = "<p>Нет открытых вопросов по этой дисциплине.</p>"; return; }

      const topicsMap = {};
      pool.forEach(q => {
        const t = q.topic || "Разное";
        if (!topicsMap[t]) topicsMap[t] = [];
        topicsMap[t].push(q);
      });

      const topics = Object.keys(topicsMap);
      const selectedQuestions = [];
      shuffle(topics);
      let topicIndex = 0;
      
      while (selectedQuestions.length < count && topics.length > 0) {
        if (topicIndex >= topics.length) { topicIndex = 0; shuffle(topics); }
        const currentTopic = topics[topicIndex];
        const topicQuestions = topicsMap[currentTopic];
        if (topicQuestions.length > 0) {
          const randomIndex = Math.floor(Math.random() * topicQuestions.length);
          selectedQuestions.push(topicQuestions[randomIndex]);
          topicQuestions.splice(randomIndex, 1);
        }
        topicIndex++;
        if (Object.values(topicsMap).every(arr => arr.length === 0)) break;
      }

      let html = `<div class="quiz-card"><h2 style="margin-bottom: 20px;">Ваш билет (${selectedQuestions.length} вопр.)</h2>`;
      selectedQuestions.forEach((q, i) => {
        html += `
          <div style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
            <span class="subject-tag">${q.topic || "Разное"}</span>
            <p style="font-weight: 500; margin-bottom: 8px;">${i+1}. ${q.question_text}</p>
            <button class="btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;" onclick="this.nextElementSibling.classList.toggle('show')">Показать ответ</button>
            <div class="explanation">
              <div class="explanation-title">Эталонный ответ</div>
              <div class="explanation-text">${q.model_answer || "Нет ответа"}</div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
      resultBox.innerHTML = html;
    };

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeIcon.textContent = '☀️'; }
    themeToggle.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); themeIcon.textContent = '🌙'; } 
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); themeIcon.textContent = '☀️'; }
    };
  </script>
</body>
</html>
