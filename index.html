<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forest Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <!-- Логотип -->
    <div class="logo-box">
      <svg class="flask-svg" viewBox="0 0 100 100">
        <path d="M35 20 L35 45 L15 85 L85 85 L65 45 L65 20 Z" fill="none" stroke="var(--text)" stroke-width="4" stroke-linejoin="round"/>
        <rect x="30" y="10" width="40" height="10" rx="2" fill="none" stroke="var(--text)" stroke-width="4"/>
        <!-- Жидкость -->
        <path d="M22 70 L78 70 L85 85 L15 85 Z" class="flask-liquid"/>
        <circle cx="40" cy="75" r="3" class="flask-bubble"/>
        <circle cx="60" cy="80" r="2" class="flask-bubble"/>
        <circle cx="50" cy="72" r="2" class="flask-bubble"/>
      </svg>
      <div class="logo-title">Forest<span>Test</span></div>
      
      <!-- Свеча (появится в темной теме) -->
      <svg class="candle-svg" viewBox="0 0 100 100">
        <rect x="30" y="40" width="40" height="50" rx="5" fill="none" stroke="var(--text)" stroke-width="4"/>
        <path d="M50 40 L50 20" fill="none" stroke="var(--text)" stroke-width="4"/>
        <!-- Огонь -->
        <path d="M50 35 Q40 25 50 10 Q60 25 50 35 Z" fill="#e07a72" class="candle-flame"/>
      </svg>
    </div>
    
    <nav>
      <a href="index.html" class="active">Дисциплины</a>
      <a href="rating.html">Рейтинг</a>
      <a href="#" class="disabled">Теория (скоро)</a>
      <a href="#" class="disabled">Статьи (скоро)</a>
    </nav>
  </aside>

  <div class="main-content">
    <header>
      <h1>Выберите дисциплину</h1>
      <button class="theme-btn" id="theme-btn">🌙</button>
    </header>
    <main>
      <div id="subject-list" class="grid"></div>
    </main>
  </div>

  <button id="scroll-top" title="Наверх">↑</button>

  <script src="data.js"></script>
  <script>
    const list = document.getElementById("subject-list");
    subjects.forEach(s => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = "subject.html?id=" + s.id;
      
      let iconSVG = "";
      if (s.icon === "eye") iconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      else if (s.icon === "book") iconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`;
      else iconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M2 12h20"></path></svg>`;
      
      a.innerHTML = `<span class="icon">${iconSVG}</span><span>${s.name}</span>`;
      list.appendChild(a);
    });

    // Кнопка темы (починена)
    const btn = document.getElementById("theme-btn");
    const isDark = localStorage.getItem("theme") === "dark";
    if (isDark) { document.body.classList.add("dark"); btn.innerHTML = "☀️"; }
    btn.onclick = () => {
      document.body.classList.toggle("dark");
      const nowDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", nowDark ? "dark" : "light");
      btn.innerHTML = nowDark ? "☀️" : "🌙";
    };

    const scrollBtn = document.getElementById("scroll-top");
    window.onscroll = () => scrollBtn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  </script>
</body>
</html>
