<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain Test — Тренажер</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-badge">🪷</div>
      <span>Rain Test</span>
    </a>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab active">Предметы</a>
      <a href="theory.html" class="nav-tab">Теория</a>
      <a href="tickets.html" class="nav-tab">Билеты</a>
      <a href="progress.html" class="nav-tab">Прогресс</a>
    </div>
    <div class="controls">
      <a href="admin.html" class="icon-btn">⚙️</a>
      <button class="icon-btn" id="themeToggle"><span id="themeIcon">🌙</span></button>
    </div>
  </header>

  <main>
    <h1 class="section-title">Выберите дисциплину</h1>
    <p class="section-subtitle">Начни подготовку к коллоквиуму или экзамену</p>
    
    <div class="subjects-grid">
      <a href="subject.html?id=obshaya" class="subject-card">
        <span class="subject-icon">☾</span>
        <div class="subject-name">Общая психология</div>
        <div class="subject-meta">Теория и практика</div>
      </a>
      <a href="subject.html?id=istoriya" class="subject-card">
        <span class="subject-icon">⚶</span>
        <div class="subject-name">История психологии</div>
        <div class="subject-meta">Этапы развития науки</div>
      </a>
      <a href="subject.html?id=antropologiya" class="subject-card">
        <span class="subject-icon">🜁</span>
        <div class="subject-name">Антропология</div>
        <div class="subject-meta">Человек и культура</div>
      </a>
      <a href="subject.html?id=anatomiya" class="subject-card">
        <span class="subject-icon">🜃</span>
        <div class="subject-name">Анатомия</div>
        <div class="subject-meta">Строение тела</div>
      </a>
    </div>
  </main>

  <!-- Озеро с лилиями внизу -->
  <div class="lily-pond">
    <svg viewBox="0 0 800 120" preserveAspectRatio="none">
      <path d="M0,120 Q100,80 200,110 T400,100 T600,115 T800,100 L800,120 Z" fill="var(--lily-leaf)" opacity="0.3"/>
      <path d="M0,120 Q150,60 300,110 T600,100 T800,110 L800,120 Z" fill="var(--lily-leaf)" opacity="0.5"/>
      <!-- Лилия 1 -->
      <g transform="translate(150, 70)">
        <path d="M0,0 C-15,-20 -20,-40 0,-50 C20,-40 15,-20 0,0" fill="var(--lily-outer)"/>
        <path d="M0,0 C-10,-15 -10,-30 0,-40 C10,-30 10,-15 0,0" fill="var(--lily-inner)"/>
        <circle cx="0" cy="-10" r="5" fill="var(--lily-core)"/>
        <ellipse cx="0" cy="10" rx="40" ry="10" fill="var(--lily-leaf)"/>
      </g>
      <!-- Лилия 2 -->
      <g transform="translate(600, 80) scale(0.8)">
        <path d="M0,0 C-15,-20 -20,-40 0,-50 C20,-40 15,-20 0,0" fill="var(--lily-outer)"/>
        <path d="M0,0 C-10,-15 -10,-30 0,-40 C10,-30 10,-15 0,0" fill="var(--lily-inner)"/>
        <circle cx="0" cy="-10" r="5" fill="var(--lily-core)"/>
        <ellipse cx="0" cy="10" rx="40" ry="10" fill="var(--lily-leaf)"/>
      </g>
    </svg>
  </div>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.textContent = '☀️';
    }
    themeToggle.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeIcon.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeIcon.textContent = '☀️';
      }
    };
  </script>
</body>
</html>
