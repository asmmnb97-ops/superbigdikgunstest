<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jelly Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo-box">
      <svg class="medusa-svg-small" viewBox="0 0 100 100">
        <path class="medusa-head" d="M 20 48 C 20 18, 80 18, 80 48 C 65 54, 35 54, 20 48 Z" />
        <path class="medusa-tentacle" d="M 32 51 Q 26 68, 34 86" />
        <path class="medusa-tentacle" d="M 44 53 Q 40 72, 46 92" />
        <path class="medusa-tentacle" d="M 56 53 Q 60 72, 54 92" />
        <path class="medusa-tentacle" d="M 68 51 Q 74 68, 66 86" />
      </svg>
      <div class="logo-title">Jelly Test<span>RETRO LAB</span></div>
    </div>
    <nav>
      <a href="index.html" class="active">Дисциплины</a>
      <a href="tickets.html">Билеты</a>
      <a href="progress.html">Прогресс</a>
      <a href="#" class="disabled">Заметки (скоро)</a>
    </nav>
  </aside>

  <div class="main-content">
    <header>
      <h1>Выберите дисциплину</h1>
      <button class="theme-btn" id="theme-btn">🌙</button>
    </header>
    <main>
      <div id="subject-list" class="grid"></div>
    </main>
  </div>
  <button id="scroll-top">↑</button>

  <script src="data.js"></script>
  <script>
    const list = document.getElementById("subject-list");
    const runes = ["☾", "⚶", "🜁", "🜃", "🜄", "🜂"];

    subjects.forEach((s, index) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = "subject.html?id=" + s.id;
      const rune = runes[index % runes.length];
      a.innerHTML = `<span class="card-icon">${rune}</span><span>${s.name}</span>`;
      list.appendChild(a);
    });

    // Инициализация темы (проверка перед загрузкой, чтобы не мигало)
    const savedTheme = localStorage.getItem("theme");
    const btn = document.getElementById("theme-btn");
    if (savedTheme === "dark") {
      document.body.classList.add("dark");
      btn.innerHTML = "☀️";
    }
    btn.onclick = () => {
      document.body.classList.toggle("dark");
      const nowDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", nowDark ? "dark" : "light");
      btn.innerHTML = nowDark ? "☀️" : "🌙";
    };

    const scrollBtn = document.getElementById("scroll-top");
    window.onscroll = () => scrollBtn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  </script>
</body>
</html>
