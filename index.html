<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jelly Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo-box">
      <!-- Маленькая медуза в меню -->
      <svg class="medusa-svg-small" viewBox="0 0 100 100">
        <path d="M20 50 Q20 20 50 20 Q80 20 80 50" class="medusa-head"/>
        <path d="M30 50 Q25 70 35 90" class="medusa-tentacle"/>
        <path d="M50 50 Q45 80 55 95" class="medusa-tentacle"/>
        <path d="M70 50 Q75 70 65 90" class="medusa-tentacle"/>
      </svg>
      <div class="logo-title">Jelly<span>Test</span></div>
    </div>
    <nav>
      <a href="index.html" class="active">Дисциплины</a>
      <a href="tickets.html">Билеты</a>
      <a href="progress.html">Прогресс</a>
      <a href="#" class="disabled">Заметки (скоро)</a>
    </nav>
  </aside>

  <div class="main-content">
    <!-- Большая медуза на фоне -->
    <div class="hero-medusa">
      <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ff6bcb" stop-opacity="0.95"/>
            <stop offset="60%" stop-color="#845ec2" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="#00d2fc" stop-opacity="0.3"/>
          </linearGradient>
          <linearGradient id="tentacleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00d2fc" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#00d2fc" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <g class="jellyfish-wrapper" filter="url(#glow)">
          <path class="tentacle-anim-1" d="M 110 140 Q 95 200 115 260 T 105 350" fill="none" stroke="url(#tentacleGrad)" stroke-width="4" stroke-linecap="round"/>
          <path class="tentacle-anim-2" d="M 135 145 Q 150 210 130 270 T 145 370" fill="none" stroke="url(#tentacleGrad)" stroke-width="5" stroke-linecap="round"/>
          <path class="tentacle-anim-3" d="M 165 145 Q 150 210 170 270 T 155 370" fill="none" stroke="url(#tentacleGrad)" stroke-width="5" stroke-linecap="round"/>
          <path class="tentacle-anim-4" d="M 190 140 Q 205 200 185 260 T 195 350" fill="none" stroke="url(#tentacleGrad)" stroke-width="4" stroke-linecap="round"/>
          <g class="bell-pulse">
            <path d="M 80 140 C 80 60, 220 60, 220 140 C 200 155, 175 135, 150 150 C 125 135, 100 155, 80 140 Z" fill="url(#bellGrad)"/>
            <ellipse cx="130" cy="95" rx="18" ry="8" transform="rotate(-25 130 95)" fill="#ffffff" opacity="0.35"/>
            <circle cx="150" cy="115" r="12" fill="#ff9671" opacity="0.4"/>
          </g>
        </g>
      </svg>
    </div>

    <header>
      <h1>Выберите дисциплину</h1>
      <button class="theme-btn" id="theme-btn">🌙</button>
    </header>
    <main>
      <div id="subject-list" class="grid"></div>
    </main>
  </div>
  <button id="scroll-top">↑</button>

  <script src="data.js"></script>
  <script>
    const list = document.getElementById("subject-list");
    const runes = ["☾", "⚶", "🜁", "🜃", "🜄", "🜂"];

    subjects.forEach((s, index) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = "subject.html?id=" + s.id;
      const rune = runes[index % runes.length];
      a.innerHTML = `<span class="card-icon">${rune}</span><span>${s.name}</span>`;
      list.appendChild(a);
    });

    const btn = document.getElementById("theme-btn");
    const isDark = localStorage.getItem("theme") === "dark";
    if (isDark) { document.body.classList.add("dark"); btn.innerHTML = "☀️"; }
    btn.onclick = () => {
      document.body.classList.toggle("dark");
      const nowDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", nowDark ? "dark" : "light");
      btn.innerHTML = nowDark ? "☀️" : "🌙";
    };

    const scrollBtn = document.getElementById("scroll-top");
    window.onscroll = () => scrollBtn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  </script>
</body>
</html>
