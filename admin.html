<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель | Rain Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><div class="logo-icon-wrap">Ψ</div><span>Rain Test</span></a>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab">Предметы</a>
      <a href="theory.html" class="nav-tab">Теория</a>
      <a href="tickets.html" class="nav-tab">Билеты</a>
      <a href="progress.html" class="nav-tab">Прогресс</a>
    </div>
    <div class="controls"><button class="icon-btn" id="themeToggle"><span id="themeIcon">🌙</span></button></div>
  </header>

  <main>
    <div id="login-box" class="quiz-card" style="max-width: 400px; margin: 40px auto;">
      <h2 style="margin-bottom: 20px; text-align: center;">Вход для админа</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Пароль">
      <button class="btn-primary" id="login-btn" style="width: 100%;">Войти</button>
      <p id="auth-msg" style="color: var(--error); margin-top: 10px; text-align: center;"></p>
    </div>

    <div id="panel-box" style="display: none; text-align: center;">
      <div class="quiz-card" style="max-width: 500px; margin: 40px auto;">
        <h2 style="margin-bottom: 10px;">Вы вошли как Админ</h2>
        <p style="color: var(--text-secondary); margin-bottom: 20px;">Теперь вы можете добавлять вопросы на страницах дисциплин.</p>
        <button class="btn-primary" onclick="window.location.href='index.html'">Перейти к предметам</button>
        <button class="btn-secondary" id="logout-btn" style="margin-left: 10px;">Выйти</button>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://vgyhmydzbshdjlmbdsbq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Wbus_dDyxCuBBxZrxubw6Q_aQnqMCAM';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    db.auth.getSession().then(({ data: { session } }) => {
      if (session) { document.getElementById("login-box").style.display = "none"; document.getElementById("panel-box").style.display = "block"; }
    });

    document.getElementById("login-btn").onclick = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) document.getElementById("auth-msg").textContent = "Ошибка: " + error.message;
      else { document.getElementById("login-box").style.display = "none"; document.getElementById("panel-box").style.display = "block"; }
    };

    document.getElementById("logout-btn").onclick = async () => {
      await db.auth.signOut();
      document.getElementById("login-box").style.display = "block";
      document.getElementById("panel-box").style.display = "none";
    };

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeIcon.textContent = '☀️'; }
    themeToggle.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); themeIcon.textContent = '🌙'; } 
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); themeIcon.textContent = '☀️'; }
    };
  </script>
</body>
</html>
