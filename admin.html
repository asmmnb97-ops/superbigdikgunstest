<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка | Rain Test</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="logo-box">
      <div class="logo-title">Rain<span>Test</span></div>
    </div>
    <nav>
      <a href="index.html">Дисциплины</a>
      <a href="admin.html" class="active">Админка</a>
    </nav>
  </aside>

  <div class="main-content">
    <header>
      <h1>Админ-панель</h1>
      <button class="theme-btn" id="theme-btn">🌙</button>
    </header>

    <main id="admin-content">
      <div id="login-box" class="question" style="max-width: 400px; margin: 0 auto;">
        <h2>Вход для админа</h2>
        <input type="email" id="email" placeholder="Email" style="width: 100%; margin-bottom: 10px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);"><br>
        <input type="password" id="password" placeholder="Пароль" style="width: 100%; margin-bottom: 10px; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);"><br>
        <button class="btn-primary" id="login-btn">Войти</button>
        <p id="auth-msg" style="color: var(--bad); margin-top: 10px;"></p>
      </div>

      <div id="panel-box" style="display: none;">
        <button class="btn-primary" id="logout-btn" style="margin-bottom: 20px;">Выйти</button>
        
        <div class="question">
          <h2>Добавить новый вопрос</h2>
          <select id="subject" style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
            <option value="anatomiya">Анатомия</option>
            <option value="obshaya">Общая психология</option>
            <option value="istoriya">История психологии</option>
            <option value="antropologiya">Антропология</option>
          </select>
          <input type="text" id="topic" placeholder="Тема (например, ЦНС)" style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
          
          <select id="q-type" style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
            <option value="test">Тестовый вопрос</option>
            <option value="open">Открытый вопрос</option>
          </select>
          
          <textarea id="q-text" placeholder="Текст вопроса" rows="3" style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);"></textarea>
          
          <div id="test-fields">
            <input type="text" id="opt0" placeholder="Вариант А" style="width: 100%; padding: 10px; margin-bottom: 5px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
            <input type="text" id="opt1" placeholder="Вариант Б" style="width: 100%; padding: 10px; margin-bottom: 5px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
            <input type="text" id="opt2" placeholder="Вариант В" style="width: 100%; padding: 10px; margin-bottom: 5px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
            <input type="number" id="correct" placeholder="Правильный ответ (0, 1 или 2)" style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
            <textarea id="explain" placeholder="Пояснение к ответу" rows="2" style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);"></textarea>
          </div>

          <div id="open-fields" style="display: none;">
            <textarea id="model-answer" placeholder="Эталонный ответ" rows="3" style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);"></textarea>
          </div>

          <button class="btn-primary" id="save-btn">Сохранить в базу</button>
          <p id="save-msg" style="color: var(--ok); margin-top: 10px;"></p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://vgyhmydzbshdjlmbdsbq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Wbus_dDyxCuBBxZrxubw6Q_aQnqMCAM';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginBox = document.getElementById("login-box");
    const panelBox = document.getElementById("panel-box");
    const authMsg = document.getElementById("auth-msg");

    db.auth.getSession().then(({ data: { session } }) => {
      if (session) showPanel();
    });

    document.getElementById("login-btn").onclick = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      
      if (error) { authMsg.textContent = "Ошибка: " + error.message; }
      else { authMsg.textContent = ""; showPanel(); }
    };

    document.getElementById("logout-btn").onclick = async () => {
      await db.auth.signOut();
      loginBox.style.display = "block";
      panelBox.style.display = "none";
    };

    function showPanel() {
      loginBox.style.display = "none";
      panelBox.style.display = "block";
    }

    document.getElementById("q-type").onchange = (e) => {
      if (e.target.value === "test") {
        document.getElementById("test-fields").style.display = "block";
        document.getElementById("open-fields").style.display = "none";
      } else {
        document.getElementById("test-fields").style.display = "none";
        document.getElementById("open-fields").style.display = "block";
      }
    };

    document.getElementById("save-btn").onclick = async () => {
      const type = document.getElementById("q-type").value;
      const subject = document.getElementById("subject").value;
      const topic = document.getElementById("topic").value;
      const qText = document.getElementById("q-text").value;
      
      let payload = {
        subject: subject,
        topic: topic,
        question_type: type,
        question_text: qText
      };

      if (type === "test") {
        payload.options = [
          document.getElementById("opt0").value,
          document.getElementById("opt1").value,
          document.getElementById("opt2").value
        ];
        payload.correct_answer = parseInt(document.getElementById("correct").value);
        payload.explanation = document.getElementById("explain").value;
      } else {
        payload.model_answer = document.getElementById("model-answer").value;
      }

      const { error } = await db.from('questions').insert([payload]);
      
      if (error) {
        document.getElementById("save-msg").style.color = "var(--bad)";
        document.getElementById("save-msg").textContent = "Ошибка: " + error.message;
      } else {
        document.getElementById("save-msg").style.color = "var(--ok)";
        document.getElementById("save-msg").textContent = "Вопрос успешно добавлен!";
        document.getElementById("q-text").value = "";
        document.getElementById("opt0").value = "";
        document.getElementById("opt1").value = "";
        document.getElementById("opt2").value = "";
        document.getElementById("explain").value = "";
        document.getElementById("model-answer").value = "";
      }
    };

    // Тема
    const btn = document.getElementById("theme-btn");
    if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark"); btn.innerHTML = "☀️"; }
    btn.onclick = () => {
      document.body.classList.toggle("dark");
      const nowDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", nowDark ? "dark" : "light");
      btn.innerHTML = nowDark ? "☀️" : "🌙";
    };
  </script>
</body>
</html>
