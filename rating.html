<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой рейтинг</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo-box">
      <svg class="flask-svg" viewBox="0 0 100 100">
        <path d="M35 20 L35 45 L15 85 L85 85 L65 45 L65 20 Z" fill="none" stroke="var(--text)" stroke-width="3" stroke-linejoin="round"/>
        <rect x="30" y="10" width="40" height="10" rx="2" fill="none" stroke="var(--text)" stroke-width="3"/>
        <path d="M24 68 L76 68 L82 83 L18 83 Z" class="flask-liquid"/>
        <circle cx="40" cy="72" r="3" class="flask-bubble"/>
      </svg>
      <div class="logo-title">Forest<span>Test</span></div>
      <svg class="candle-svg" viewBox="0 0 100 100">
        <path d="M50 35 Q42 25 50 10 Q58 25 50 35 Z" class="candle-flame"/>
        <rect x="30" y="40" width="40" height="50" rx="3" class="candle-wax"/>
        <line x1="50" y1="40" x2="50" y2="30" class="candle-wick"/>
      </svg>
    </div>
    <nav>
      <a href="index.html">Дисциплины</a>
      <a href="rating.html" class="active">Рейтинг</a>
    </nav>
  </aside>

  <div class="main-content">
    <header>
      <h1>Ваш прогресс</h1>
      <button class="theme-btn" id="theme-btn">🌙</button>
    </header>
    <main id="rating-content"></main>
  </div>
  <button id="scroll-top">↑</button>

  <script src="data.js"></script>
  <script>
    const content = document.getElementById("rating-content");
    const scores = JSON.parse(localStorage.getItem("scores") || "{}");
    
    if (Object.keys(scores).length === 0) {
      content.innerHTML = "<p>Вы пока не набрали баллов. Перейдите к дисциплинам и начните решать!</p>";
    } else {
      let html = "<div class='rating-grid'>";
      for (const [subId, score] of Object.entries(scores)) {
        const subName = subjects.find(s => s.id === subId)?.name || subId;
        html += `
          <div class="rating-card">
            <div class="rating-title">${subName}</div>
            <div class="rating-score">${score} <span style="font-size:16px; font-weight:normal; color:var(--text)">баллов</span></div>
            <div class="rating-label">Общий прогресс</div>
          </div>
        `;
      }
      html += "</div>";
      content.innerHTML = html;
    }

    const btn = document.getElementById("theme-btn");
    const isDark = localStorage.getItem("theme") === "dark";
    if (isDark) { document.body.classList.add("dark"); btn.innerHTML = "☀️"; }
    btn.onclick = () => {
      document.body.classList.toggle("dark");
      const nowDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", nowDark ? "dark" : "light");
      btn.innerHTML = nowDark ? "☀️" : "🌙";
    };

    const scrollBtn = document.getElementById("scroll-top");
    window.onscroll = () => scrollBtn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  </script>
</body>
</html>
