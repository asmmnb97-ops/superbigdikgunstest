<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой прогресс</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo-box">
      <svg class="jellyfish-svg" viewBox="0 0 100 100">
        <path d="M20 50 C20 20 80 20 80 50 C80 60 70 65 50 65 C30 65 20 60 20 50 Z" class="jelly-bell"/>
        <path d="M30 60 Q25 80 30 95" class="jelly-tentacle"/>
        <path d="M50 65 Q50 85 55 100" class="jelly-tentacle"/>
        <path d="M70 60 Q75 80 70 95" class="jelly-tentacle"/>
      </svg>
      <div class="logo-title">Forest<span>Test</span></div>
    </div>
    <nav>
      <a href="index.html">Дисциплины</a>
      <a href="rating.html" class="active">Прогресс</a>
    </nav>
  </aside>

  <div class="main-content">
    <header>
      <h1>Ваш прогресс</h1>
      <button class="theme-btn" id="theme-btn">☾</button>
    </header>
    <main id="rating-content"></main>
  </div>
  <button id="scroll-top">↑</button>

  <script src="data.js"></script>
  <script>
    const content = document.getElementById("rating-content");
    const scores = JSON.parse(localStorage.getItem("scores") || "{}");
    
    if (Object.keys(scores).length === 0) {
      content.innerHTML = "<p>Вы пока не набрали баллов. Перейдите к дисциплинам!</p>";
    } else {
      let html = "<div class='rating-grid'>";
      for (const [subId, score] of Object.entries(scores)) {
        const subName = subjects.find(s => s.id === subId)?.name || subId;
        html += `
          <div class="rating-card">
            <div class="rating-title">${subName}</div>
            <div class="rating-score">${score} <span style="font-size:16px; font-weight:normal; color:var(--text)">баллов</span></div>
            <div class="rating-label">Текущий прогресс</div>
          </div>
        `;
      }
      html += "</div>";
      content.innerHTML = html;
    }

    const btn = document.getElementById("theme-btn");
    const isDark = localStorage.getItem("theme") === "dark" || !localStorage.getItem("theme");
    if (isDark) { document.body.classList.add("dark"); btn.innerHTML = "☾"; }
    else { btn.innerHTML = "☀"; }
    btn.onclick = () => {
      document.body.classList.toggle("dark");
      const nowDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", nowDark ? "dark" : "light");
      btn.innerHTML = nowDark ? "☾" : "☀";
    };

    const scrollBtn = document.getElementById("scroll-top");
    window.onscroll = () => scrollBtn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  </script>
</body>
</html>
